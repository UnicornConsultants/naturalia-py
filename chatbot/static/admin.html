<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Naturalia B2B 管理後台</title><link rel="stylesheet" href="/admin.css"><body><div id="auth" class="auth-wrap"><section class="auth-card"><div class="wordmark">NATURALIA</div><p class="eyebrow">B2B PARTNER PORTAL</p><h1 id="auth-title">管理後台</h1><p id="auth-hint" class="muted">正在確認登入狀態…</p><form id="auth-form" hidden><label id="name-label" hidden>姓名<input name="name" autocomplete="name" maxlength="80"></label><label>登入名稱<input name="username" required autocomplete="username" maxlength="80"></label><label>密碼<input name="password" type="password" required minlength="8" maxlength="200" autocomplete="current-password"></label><button type="submit" id="login">登入</button></form><p id="auth-error" class="error" role="alert"></p><p class="footnote">獨立 B2B 業務與充值管理。SHOPLINE 店面只接入客服及導購插件。</p></section></div><div id="shell" hidden><header class="app-header" aria-label="全站導覽"><div class="app-brand"><span class="wordmark">NATURALIA</span><span class="app-caption">B2B 管理後台</span></div><div class="header-actions"><span class="badge">本機測試帳本</span><details id="notification-bell" class="notification-bell"><summary id="bell-trigger" aria-label="通知，沒有待處理事項"><span aria-hidden="true">🔔</span><span id="bell-count" class="notification-count" hidden></span></summary><div class="notification-popover"><h2>通知</h2><p id="bell-status" role="status">暫時沒有待處理事項</p><div id="bell-items"></div></div></details></div></header><aside class="sidebar"><nav id="nav" aria-label="管理選單"></nav><div class="sidebar-bottom"><span id="staff-label"></span><button id="logout" class="ghost">登出</button></div></aside><main><header class="page-heading"><div><p class="eyebrow">PARTNER WORKSPACE</p><h1 id="page-title">工作台</h1></div></header><div id="notice" role="status" hidden></div><div id="content"></div><footer>充值由 Naturalia B2B 獨立管理。與 SHOPLINE B2C 的會員、購物金及訂單分開。</footer></main></div><script src="/chat-workflow.js"></script><script src="/admin.js"></script></body></html>
