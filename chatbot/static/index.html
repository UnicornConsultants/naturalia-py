<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Naturalia 商品助手</title><link rel="stylesheet" href="/style.css"><body><main><header><span class="brand">NATURALIA</span><span>商品導購 · 開發預覽</span></header><section class="intro"><small>YOUR PERSONAL CARE COMPANION</small><h1>從你的需要，<br>找到合適的日常呵護。</h1><p>唔使記低完整產品名。講出你的需要，<br>一齊探索護膚、香薰與保養選擇。</p><div class="chips"><button>我想找肌膚保養套裝</button><button>想搵提亮膚色嘅護膚套裝</button><button>想要保濕面霜</button></div><aside>商品資料：2026-11-16 存檔<br>價格及供應以商品網站為準。</aside></section><section class="chat" aria-label="商品助手"><div class="chathead"><div><strong>Naturalia 商品助手</strong><div id="status">資料檢索模式</div></div><button id="clear" aria-label="重新開始對話">重新開始</button></div><nav class="services" aria-label="快捷服務"><button>我想搵護膚套裝</button><button>運送政策</button><button>退換貨政策</button><button>充值</button><button>查詢餘額</button><button>聯絡 CS</button></nav><div id="messages" aria-live="polite"><div class="bubble assistant">你好，歡迎嚟到 Naturalia！🌿 我可以幫你按功效、品牌或預算搵產品，亦可以協助充值同以充值額購物。想先搵產品，定辦理充值？</div></div><form><label for="question">告訴我你的需要</label><div class="entry"><input id="question" maxlength="1000" placeholder="例如：有冇保濕套裝？" required autocomplete="off"><button id="submit">送出</button></div><p class="privacy">對話於本機保存最多 7 日；重新開始會刪除對話，充值及訂單記錄保留。本機獨立測試版；付款須人工核款，B2B 帳戶須核實綁定。</p></form></section></main><script src="/chat-workflow.js"></script><script src="/app.js"></script></body></html>
