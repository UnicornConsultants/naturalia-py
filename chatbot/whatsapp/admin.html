</style><body><main><header><div><small>NATURALIA / CHANNELS</small><h1>WhatsApp 商品助手</h1></div><a href="http://127.0.0.1:8765" target="_blank" rel="noopener">開啟網站聊天版</a></header><div class="grid"><aside><section class="panel"><h2>連接 WhatsApp</h2><p id="connection">讀取連線狀態…</p><p class="muted" id="account"></p><img id="qr" hidden alt="WhatsApp 連結裝置 QR Code"><p class="muted">手機 WhatsApp → 已連結裝置 → 連結裝置，掃描此 QR Code。</p><div class="actions"><button id="connect">產生 QR Code</button><button id="disconnect" class="secondary">斷開連線</button></div><button id="reset-connection" class="secondary">重設本機連線以重新掃碼</button><p id="error" role="status"></p></section><section class="panel"><h2>回覆設定</h2><label for="mode">運作模式</label><select id="mode"><option value="paused">暫停 AI 回覆</option><option value="draft">產生草稿，人工確認送出</option><option value="auto">自動回覆新收到的私訊</option></select><button id="save-mode">套用模式</button><p class="muted">使用 Kimi K2.6 及商品 RAG。真實訊息生成會使用模型額度；群組、歷史同步、自己發出的訊息不會觸發回覆。</p></section><section class="panel"><h2>本機模擬測試</h2><p class="muted">不用掃碼、不調用 Kimi、不發送 WhatsApp。只測商品檢索及對話流程。</p><label for="test-text">客人訊息</label><textarea id="test-text" maxlength="1000">我想找肌膚保養套裝</textarea><button id="simulate">模擬收到訊息</button></section></aside><section class="panel"><h2>對話及回覆記錄</h2><label><input type="checkbox" id="show-test" checked> 顯示本機模擬記錄</label><p class="muted">WhatsApp 對話獨立保存，不代表客人已驗證 SHOPLINE 會員身份。目前只支援文字。</p><div id="inbox" aria-live="polite"></div></section></div></main><script src="/admin.js"></script></body></html>
